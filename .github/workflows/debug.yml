name: Build a Debug APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Flutter from submodule
        run: |
          export PATH="$PATH:$PWD/flutter/bin"
          echo "$PWD/flutter/bin" >> $GITHUB_PATH
          flutter --version
          flutter config --no-analytics
          flutter precache

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build -d

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze code
        run: dart analyze --no-fatal-warnings lib

      - name: Run tests
        run: flutter test

  patrol:
    name: Patrol Android system tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        run: |
          chmod +x flutter/bin/*
          export PATH="$GITHUB_WORKSPACE/flutter/bin:$PATH"
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
          flutter --version
          flutter config --no-analytics

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Patrol tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: patrol test -t patrol_test/android_system_test.dart

  build-android:
    runs-on: ubuntu-latest
    # PUB_CACHE must match fdroiddata's `export PUB_CACHE=$(pwd)/.pub-cache` so that
    # package source paths in debug info are identical.
    # ANDROID_HOME is normalized to /opt/android-sdk by the Normalize step below so
    # that native toolchain paths embedded in libdartjni.so debug info match fdroiddata.
    env:
      PUB_CACHE: /home/brandon/market_monk/.pub-cache
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      # Build from /home/brandon/market_monk to match fdroiddata reproducible build path,
      # so the dart_plugin_registrant.dart file URI embedded in libapp.so is identical.
      # Use cp -al (hardlink copy) so $GITHUB_WORKSPACE still exists for Actions internals.
      - name: Create fdroiddata build path
        run: |
          sudo mkdir -p /home/brandon
          sudo cp -al "$GITHUB_WORKSPACE" /home/brandon/market_monk
          sudo chown -R runner:runner /home/brandon/market_monk

      # Normalize the Android SDK path to /opt/android-sdk so that native compilation
      # paths (embedded in libdartjni.so debug info and thus the build ID) are identical
      # between GitHub Actions and the fdroiddata build server.
      - name: Normalize Android SDK path
        run: |
          sudo mkdir -p /opt/android-sdk
          sudo cp -a "$ANDROID_HOME/." /opt/android-sdk/
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter from submodule
        working-directory: /home/brandon/market_monk
        run: |
          export PATH="$PATH:/home/brandon/market_monk/flutter/bin"
          echo "/home/brandon/market_monk/flutter/bin" >> $GITHUB_PATH
          flutter --version
          flutter config --no-analytics
          flutter precache

      - name: Get dependencies
        working-directory: /home/brandon/market_monk
        run: flutter pub get

      - name: Run build_runner
        working-directory: /home/brandon/market_monk
        run: dart run build_runner build -d

      - name: Build APK for arm64-v8a
        working-directory: /home/brandon/market_monk
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi

      - name: Build universal APK
        working-directory: /home/brandon/market_monk
        run: |
          flutter build apk --debug
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/market_monk.apk

      - name: Build App Bundle
        working-directory: /home/brandon/market_monk
        run: flutter build appbundle --debug

      - name: Upload APK artifact
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: android-apk
          path: |
            /home/brandon/market_monk/build/app/outputs/flutter-apk/app-*-debug.apk
            /home/brandon/market_monk/build/app/outputs/flutter-apk/market_monk.apk

      - name: Upload AAB artifact
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: android-aab
          path: /home/brandon/market_monk/build/app/outputs/bundle/debug/app-debug.aab
